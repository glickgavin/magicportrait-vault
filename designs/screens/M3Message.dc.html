<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Step 3, message and send</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=DM+Serif+Display&amp;display=swap">
<style>
body{margin:0}
a{color:#B8059F}a:hover{color:#8E047B}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F1E7; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: rgba(0,0,0,0.8); display: flex; flex-direction: column">
<header style="position: relative; height: 56px; flex: none; border-bottom: 1px solid rgba(0,0,0,0.08)">
<a href="Menu.dc.html" aria-label="Open menu" style="position: absolute; top: 6px; left: 10px; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,0.8)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></a>
<img src="/_blob/6ca1ce174b637e11bfd9bef1055ab7fa" alt="Magic Portraits AI by StoryBoards" style="position: absolute; top: 13px; left: 50%; transform: translateX(-50%); height: 30px">
<a href="Account.dc.html" aria-label="Your account" style="position: absolute; top: 6px; right: 58px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none"><span style="width: 34px; height: 34px; border-radius: 999px; background: linear-gradient(135deg, #FF8F3F, #F24BDF 55%, #DD07C4); color: #FFFFFF; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #F3F1E7, 0 0 0 3.5px rgba(221,7,196,0.35)">SL</span></a>
<button type="button" aria-label="Cart" style="position: absolute; top: 6px; right: 10px; width: 44px; height: 44px; border-radius: 12px; border: 0; background: rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,0.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg></button>
</header>
<div style="flex: 1; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px">
<a href="M2Portrait.dc.html" aria-label="Back to portrait" style="flex: none; width: 44px; height: 44px; border-radius: 12px; background: rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,0.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 700">Step 3 of 4</span><span style="color: rgba(0,0,0,0.6)">Message</span></div>
<div style="height: 6px; border-radius: 999px; background: rgba(0,0,0,0.08)"><div style="width: 75%; height: 6px; border-radius: 999px; background: linear-gradient(90deg, #FF8F3F, #F24BDF, #DD07C4)"></div></div>
</div>
</div>
<div style="flex: none; align-self: center; width: 180px; height: 252px; overflow: hidden; border-radius: 10px; box-shadow: 0 10px 24px rgba(0,0,0,0.16)"><div style="width: 300px; height: 420px; transform: scale(0.6); transform-origin: 0 0"><dc-import name="CardPreview" variant="xmas-snow" to-name="{{previewTo}}" from-name="{{previewFrom}}" message="{{message}}" photo-label="Biscuit, Royalty" hint-size="300px,420px"></dc-import></div></div>
<p style="margin: -6px 0 0; text-align: center; font-size: 12px; color: rgba(0,0,0,0.6)">Live preview</p>
<div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="to" style="font-size: 14px; font-weight: 700">To</label><input id="to" type="text" value="{{toName}}" onChange="{{onTo}}" placeholder="Their name" style="min-height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.12); background: #FAF8F5; font: inherit; font-size: 16px; color: rgba(0,0,0,0.8); min-width: 0"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="from" style="font-size: 14px; font-weight: 700">From</label><input id="from" type="text" value="{{fromName}}" onChange="{{onFrom}}" placeholder="Your name" style="min-height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.12); background: #FAF8F5; font: inherit; font-size: 16px; color: rgba(0,0,0,0.8); min-width: 0"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><label for="msg" style="font-size: 14px; font-weight: 700">Message</label><span style="font-size: 12px; color: rgba(0,0,0,0.6)">{{count}} / 220</span></div>
<textarea id="msg" rows="3" maxlength="220" value="{{message}}" onChange="{{onMsg}}" style="padding: 12px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.12); background: #FAF8F5; font: inherit; font-size: 16px; line-height: 1.45; color: rgba(0,0,0,0.8); resize: none"></textarea>
<div style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px">
<sc-for list="{{ideas}}" as="i" hint-placeholder-count="3">
<button type="button" onClick="{{i.use}}" style="flex: none; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 0; background: #FDE7FA; color: #8E047B; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">{{i.label}}</button>
</sc-for>
</div>
</div>
</div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-size: 14px; font-weight: 700">How should it reach them?</p>
<div role="radiogroup" aria-label="Delivery" style="display: flex; gap: 4px; padding: 6px; border-radius: 16px; background: #F3F1E7">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="flex: 1; min-height: 44px; border-radius: 12px; border: 0; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; background: {{m.bg}}; color: {{m.fg}}">{{m.label}}</button>
</sc-for>
</div>
<sc-if value="{{isEmail}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="em" style="font-size: 14px; font-weight: 700">Their email</label><input id="em" type="email" value="{{email}}" onChange="{{onEmail}}" placeholder="name@example.com" style="min-height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.12); background: #FAF8F5; font: inherit; font-size: 16px; color: rgba(0,0,0,0.8)"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="when" style="font-size: 14px; font-weight: 700">When</label><select id="when" style="min-height: 48px; padding: 0 10px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.12); background: #FAF8F5; font: inherit; font-size: 16px; color: rgba(0,0,0,0.8)"><option>Send now</option><option>Pick a date</option></select></div>
</div>
</sc-if>
<sc-if value="{{isSelf}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: rgba(0,0,0,0.6)">You will get the JPEG and a link to share on WhatsApp, Messages, Instagram or anywhere else.</p>
</sc-if>
</div>
</div>
<div style="flex: none; padding: 12px 16px 20px; background: #FFFFFF; border-top: 1px solid rgba(0,0,0,0.08)">
<a href="M4Creating.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 12px; background: linear-gradient(89deg, #FF8F3F -4.82%, #F24BDF 52.24%, #DD07C4 102.1%); box-shadow: 0 2px 0 0 rgba(0,0,0,0.07), 0 -2px 0 0 rgba(0,0,0,0.12) inset; color: #FFFFFF; font-weight: 700; font-size: 16px; text-decoration: none">Create my card
<svg width="16" height="16" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9z"></path><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg></a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { toName: 'Grandma Rose', fromName: 'Sam', email: 'rose@example.com', message: 'Merry Christmas! Biscuit put on his royal robes just for you. Love you lots.', mode: 'email' };
  }
  renderVals() {
    const s = this.state;
    const grad = 'linear-gradient(89deg, #FF8F3F -4.82%, #F24BDF 52.24%, #DD07C4 102.1%)';
    const ideaText = {
      'Warm': 'Wishing you a wonderful Christmas, full of love and laughter.',
      'Funny': 'Biscuit sat very still for this. Please appreciate his sacrifice. Merry Christmas!',
      'Heartfelt': 'Thank you for everything this year. You make every Christmas special.'
    };
    const ideas = Object.keys(ideaText).map((k) => ({ label: k, use: () => this.setState({ message: ideaText[k] }) }));
    const modes = [{ id: 'email', label: 'Email it for me' }, { id: 'self', label: 'I will share it' }].map((m) => {
      const on = s.mode === m.id;
      return { ...m, on: on, bg: on ? grad : 'transparent', fg: on ? '#FFFFFF' : 'rgba(0,0,0,0.6)', pick: () => this.setState({ mode: m.id }) };
    });
    return {
      toName: s.toName, fromName: s.fromName, email: s.email, message: s.message,
      previewTo: s.toName || '[Name]', previewFrom: s.fromName || '[Your name]',
      count: s.message.length, ideas, modes,
      isEmail: s.mode === 'email', isSelf: s.mode === 'self',
      onTo: (e) => this.setState({ toName: e.target.value }),
      onFrom: (e) => this.setState({ fromName: e.target.value }),
      onEmail: (e) => this.setState({ email: e.target.value }),
      onMsg: (e) => this.setState({ message: e.target.value.slice(0, 220) })
    };
  }
}
</script>
</body>
</html>
