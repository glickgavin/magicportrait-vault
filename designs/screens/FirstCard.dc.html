<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First card, one screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=DM+Serif+Display&amp;display=swap">
<style>
body{margin:0}
a{color:#B8059F}a:hover{color:#8E047B}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F1E7; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: rgba(0,0,0,0.8); display: flex; flex-direction: column">
<header style="position: relative; height: 56px; flex: none; border-bottom: 1px solid rgba(0,0,0,0.08)">
<a href="Menu.dc.html" aria-label="Open menu" style="position: absolute; top: 6px; left: 10px; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,0.8)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></a>
<img src="/_blob/6ca1ce174b637e11bfd9bef1055ab7fa" alt="Magic Portraits AI by StoryBoards" style="position: absolute; top: 13px; left: 50%; transform: translateX(-50%); height: 30px">
<a href="Account.dc.html" aria-label="Your account" style="position: absolute; top: 6px; right: 58px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none"><span style="width: 34px; height: 34px; border-radius: 999px; background: linear-gradient(135deg, #FF8F3F, #F24BDF 55%, #DD07C4); color: #FFFFFF; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #F3F1E7, 0 0 0 3.5px rgba(221,7,196,0.35)">SL</span></a>
<button type="button" aria-label="Cart" style="position: absolute; top: 6px; right: 10px; width: 44px; height: 44px; border-radius: 12px; border: 0; background: rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,0.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg></button>
</header>
<div style="flex: 1; overflow-y: auto; scrollbar-width: none; padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
<span style="padding: 5px 12px; border-radius: 999px; background: #FDE7FA; color: #8E047B; font-size: 12px; font-weight: 700; letter-spacing: 0.04em">YOUR FREE GIFT</span>
<h1 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 800">We made you a card</h1>
<p style="margin: 0; font-size: 14px; color: rgba(0,0,0,0.6)">Add a name and send it. That's it.</p>
</div>
<div style="flex: none; align-self: center; width: 186px; height: 260px; overflow: hidden; border-radius: 10px; box-shadow: 0 12px 28px rgba(0,0,0,0.18)"><div style="width: 300px; height: 420px; transform: scale(0.62); transform-origin: 0 0"><dc-import name="CardPreview" variant="{{variant}}" to-name="{{previewTo}}" from-name="Sam" message="{{message}}" photo-label="Biscuit, Royalty" hint-size="300px,420px"></dc-import></div></div>
<div style="display: flex; justify-content: center; gap: 8px">
<button type="button" onClick="{{nextDesign}}" style="display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(0,0,0,0.12); background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700; color: rgba(0,0,0,0.8); cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B8059F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>Change design</button>
<a href="M2Portrait.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(0,0,0,0.12); background: #FFFFFF; font-size: 13px; font-weight: 700; color: rgba(0,0,0,0.8); text-decoration: none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B8059F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-5-5L5 21"></path></svg>Change photo</a>
</div>
<p style="margin: -6px 0 0; text-align: center; font-size: 12px; color: rgba(0,0,0,0.6)">{{designLabel}}</p>
<div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="fc-to" style="font-size: 15px; font-weight: 800">Who is it for?</label>
<input id="fc-to" type="text" value="{{toName}}" onChange="{{onTo}}" placeholder="Their name, e.g. Grandma" autocomplete="off" style="min-height: 52px; padding: 0 14px; border-radius: 12px; border: 1.5px solid {{toBorder}}; background: #FAF8F5; font: inherit; font-size: 17px; color: rgba(0,0,0,0.8)">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><label for="fc-msg" style="font-size: 14px; font-weight: 700">Message</label><button type="button" onClick="{{nextIdea}}" style="padding: 0; border: 0; background: none; font: inherit; font-size: 13px; font-weight: 700; color: #B8059F; cursor: pointer">Try another</button></div>
<textarea id="fc-msg" rows="2" maxlength="220" value="{{message}}" onChange="{{onMsg}}" style="padding: 12px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.12); background: #FAF8F5; font: inherit; font-size: 15px; line-height: 1.45; color: rgba(0,0,0,0.8); resize: none"></textarea>
<p style="margin: 0; font-size: 12px; color: rgba(0,0,0,0.6)">From Sam · <a href="M3Message.dc.html" style="font-weight: 700">change</a></p>
</div>
<div role="radiogroup" aria-label="How should it reach them?" style="display: flex; gap: 4px; padding: 6px; border-radius: 16px; background: #F3F1E7">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="flex: 1; min-height: 44px; border-radius: 12px; border: 0; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; background: {{m.bg}}; color: {{m.fg}}">{{m.label}}</button>
</sc-for>
</div>
<sc-if value="{{isEmail}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 6px"><label for="fc-em" style="font-size: 14px; font-weight: 700">Their email</label><input id="fc-em" type="email" value="{{email}}" onChange="{{onEmail}}" placeholder="name@example.com" autocomplete="off" style="min-height: 48px; padding: 0 12px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.12); background: #FAF8F5; font: inherit; font-size: 16px; color: rgba(0,0,0,0.8)"><span style="font-size: 12px; color: rgba(0,0,0,0.6)">We send it now, from you.</span></div>
</sc-if>
<sc-if value="{{isSelf}}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; font-size: 13px; line-height: 1.45; color: rgba(0,0,0,0.6)">Next you can send it on WhatsApp or Messages, or save the picture.</p>
</sc-if>
</div>
</div>
<div style="flex: none; padding: 12px 16px 16px; background: #FFFFFF; border-top: 1px solid rgba(0,0,0,0.08); display: flex; flex-direction: column; gap: 8px">
<a href="M4Creating.dc.html" aria-disabled="{{notReady}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 12px; background: linear-gradient(89deg, #FF8F3F -4.82%, #F24BDF 52.24%, #DD07C4 102.1%); box-shadow: 0 2px 0 0 rgba(0,0,0,0.07), 0 -2px 0 0 rgba(0,0,0,0.12) inset; color: #FFFFFF; font-weight: 700; font-size: 16px; text-decoration: none; opacity: {{ctaOpacity}}">{{ctaLabel}}
<svg width="16" height="16" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M12 2l1.9 6.1L20 10l-6.1 1.9L12 18l-1.9-6.1L4 10l6.1-1.9z"></path><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg></a>
<a href="M1Theme.dc.html" style="align-self: center; font-size: 13px; font-weight: 700">See all designs</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"delivery":{"editor":"enum","options":["self","email"],"default":"self"},"filled":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const filled = props.filled ?? true;
    this.state = { toName: filled ? 'Grandma' : '', email: '', mode: props.delivery || 'self', idea: 0, design: 0 };
  }
  renderVals() {
    const s = this.state;
    const grad = 'linear-gradient(89deg, #FF8F3F -4.82%, #F24BDF 52.24%, #DD07C4 102.1%)';
    const designs = [
      { variant: 'xmas-snow', label: 'Christmas · Snowfall, in season now' },
      { variant: 'holidays-winter', label: 'Happy Holidays · Winter pines' },
      { variant: 'general-love', label: 'With love · Hearts' }
    ];
    const ideas = [
      'Merry Christmas! Biscuit put on his royal robes just for you.',
      'Wishing you a wonderful Christmas, full of love and laughter.',
      'Biscuit sat very still for this. Please appreciate his sacrifice!'
    ];
    const d = designs[s.design % designs.length];
    const message = s.message ?? ideas[s.idea % ideas.length];
    const modes = [{ id: 'self', label: "I'll share it" }, { id: 'email', label: 'Email it for me' }].map((m) => {
      const on = s.mode === m.id;
      return { ...m, on: on, bg: on ? grad : 'transparent', fg: on ? '#FFFFFF' : 'rgba(0,0,0,0.6)', pick: () => this.setState({ mode: m.id }) };
    });
    const ready = s.toName.trim().length > 0 && (s.mode === 'self' || s.email.includes('@'));
    return {
      variant: d.variant, designLabel: d.label,
      toName: s.toName, email: s.email, message,
      previewTo: s.toName.trim() || '[Their name]',
      toBorder: s.toName.trim() ? 'rgba(0,0,0,0.12)' : '#DD07C4',
      modes, isEmail: s.mode === 'email', isSelf: s.mode === 'self',
      ctaLabel: s.mode === 'email' ? 'Create and send' : 'Create my card',
      notReady: !ready, ctaOpacity: ready ? 1 : 0.55,
      nextDesign: () => this.setState({ design: s.design + 1 }),
      nextIdea: () => this.setState({ idea: s.idea + 1, message: undefined }),
      onTo: (e) => this.setState({ toName: e.target.value }),
      onEmail: (e) => this.setState({ email: e.target.value }),
      onMsg: (e) => this.setState({ message: e.target.value.slice(0, 220) })
    };
  }
}
</script>
</body>
</html>
