<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Greeting card template</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=DM+Serif+Display&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 300px; height: 420px; position: relative; overflow: hidden; box-sizing: border-box; background: {{bg}}; color: {{ink}}; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
<sc-if value="{{isConfetti}}" hint-placeholder-val="{{ false }}">
<svg width="300" height="420" viewBox="0 0 300 420" style="position: absolute; inset: 0" aria-hidden="true">
<rect x="22" y="26" width="10" height="4" rx="1" fill="#E4572E" transform="rotate(25 27 28)"></rect>
<rect x="60" y="14" width="8" height="4" rx="1" fill="#F2A541" transform="rotate(-30 64 16)"></rect>
<circle cx="250" cy="22" r="3" fill="#7B61FF"></circle>
<rect x="268" y="48" width="10" height="4" rx="1" fill="#2FA37A" transform="rotate(40 273 50)"></rect>
<circle cx="18" cy="70" r="2.5" fill="#2FA37A"></circle>
<rect x="232" y="64" width="8" height="4" rx="1" fill="#E4572E" transform="rotate(-15 236 66)"></rect>
<circle cx="282" cy="120" r="3" fill="#F2A541"></circle>
<rect x="12" y="140" width="9" height="4" rx="1" fill="#7B61FF" transform="rotate(60 16 142)"></rect>
<circle cx="276" cy="300" r="2.5" fill="#E4572E"></circle>
<rect x="16" y="320" width="9" height="4" rx="1" fill="#F2A541" transform="rotate(-40 20 322)"></rect>
<circle cx="40" cy="392" r="3" fill="#7B61FF"></circle>
<rect x="258" y="392" width="10" height="4" rx="1" fill="#2FA37A" transform="rotate(20 263 394)"></rect>
</svg>
</sc-if>
<sc-if value="{{isBalloons}}" hint-placeholder-val="{{ false }}">
<svg width="300" height="420" viewBox="0 0 300 420" style="position: absolute; inset: 0" aria-hidden="true">
<path d="M30 92 q-8 22 4 44" stroke="#14304F" stroke-width="1" fill="none"></path>
<ellipse cx="30" cy="66" rx="18" ry="24" fill="#2F6FDB"></ellipse>
<path d="M266 82 q8 22 -4 48" stroke="#14304F" stroke-width="1" fill="none"></path>
<ellipse cx="266" cy="58" rx="17" ry="22" fill="#F2A541"></ellipse>
<path d="M244 70 q-4 26 6 52" stroke="#14304F" stroke-width="1" fill="none"></path>
<ellipse cx="244" cy="48" rx="14" ry="19" fill="#E86A92"></ellipse>
</svg>
</sc-if>
<sc-if value="{{isStar}}" hint-placeholder-val="{{ false }}">
<svg width="300" height="420" viewBox="0 0 300 420" style="position: absolute; inset: 0" aria-hidden="true">
<rect x="10" y="10" width="280" height="400" rx="4" fill="none" stroke="#E9B949" stroke-width="1"></rect>
<polygon points="30,18 33,26 41,26 35,31 37,39 30,34 23,39 25,31 19,26 27,26" fill="#E9B949"></polygon>
<polygon points="270,18 273,26 281,26 275,31 277,39 270,34 263,39 265,31 259,26 267,26" fill="#E9B949"></polygon>
<circle cx="30" cy="396" r="4" fill="#C8473D"></circle>
<circle cx="38" cy="392" r="4" fill="#C8473D"></circle>
<circle cx="262" cy="392" r="4" fill="#C8473D"></circle>
<circle cx="270" cy="396" r="4" fill="#C8473D"></circle>
</svg>
</sc-if>
<sc-if value="{{isSnow}}" hint-placeholder-val="{{ false }}">
<svg width="300" height="420" viewBox="0 0 300 420" style="position: absolute; inset: 0" aria-hidden="true">
<circle cx="20" cy="20" r="3" fill="#BFD0DE"></circle><circle cx="56" cy="40" r="2" fill="#BFD0DE"></circle>
<circle cx="90" cy="12" r="2.5" fill="#BFD0DE"></circle><circle cx="214" cy="16" r="2" fill="#BFD0DE"></circle>
<circle cx="250" cy="38" r="3" fill="#BFD0DE"></circle><circle cx="284" cy="14" r="2" fill="#BFD0DE"></circle>
<circle cx="14" cy="110" r="2" fill="#BFD0DE"></circle><circle cx="288" cy="150" r="2.5" fill="#BFD0DE"></circle>
<circle cx="18" cy="250" r="2.5" fill="#BFD0DE"></circle><circle cx="284" cy="270" r="2" fill="#BFD0DE"></circle>
<circle cx="24" cy="400" r="2" fill="#BFD0DE"></circle><circle cx="276" cy="404" r="3" fill="#BFD0DE"></circle>
<path d="M0 412 q75 -14 150 0 t150 0 v8 h-300z" fill="#FFFFFF"></path>
</svg>
</sc-if>
<sc-if value="{{isFireworks}}" hint-placeholder-val="{{ false }}">
<svg width="300" height="420" viewBox="0 0 300 420" style="position: absolute; inset: 0" aria-hidden="true">
<g stroke="#E7C46A" stroke-width="1.5" stroke-linecap="round">
<path d="M46 50 L58 50 M44 54 L53 63 M40 56 L40 68 M36 54 L27 63 M34 50 L22 50 M36 46 L27 37 M40 44 L40 32 M44 46 L53 37"></path>
<g transform="translate(222 20)"><path d="M46 50 L58 50 M44 54 L53 63 M40 56 L40 68 M36 54 L27 63 M34 50 L22 50 M36 46 L27 37 M40 44 L40 32 M44 46 L53 37"></path></g>
</g>
<circle cx="150" cy="14" r="1.5" fill="#E7C46A"></circle><circle cx="110" cy="24" r="1" fill="#F5F1E6"></circle>
<circle cx="196" cy="30" r="1" fill="#F5F1E6"></circle><circle cx="20" cy="200" r="1.5" fill="#E7C46A"></circle>
<circle cx="282" cy="230" r="1.5" fill="#E7C46A"></circle><circle cx="270" cy="380" r="1" fill="#F5F1E6"></circle>
</svg>
</sc-if>
<sc-if value="{{isBubbles}}" hint-placeholder-val="{{ false }}">
<svg width="300" height="420" viewBox="0 0 300 420" style="position: absolute; inset: 0" aria-hidden="true">
<g fill="none" stroke="#B8892B" stroke-width="1">
<circle cx="22" cy="60" r="6"></circle><circle cx="34" cy="96" r="3.5"></circle><circle cx="18" cy="140" r="9"></circle>
<circle cx="280" cy="40" r="8"></circle><circle cx="268" cy="82" r="4"></circle><circle cx="284" cy="130" r="5"></circle>
<circle cx="24" cy="360" r="5"></circle><circle cx="276" cy="350" r="7"></circle><circle cx="262" cy="394" r="3"></circle>
</g>
</svg>
</sc-if>
<sc-if value="{{isLeaves}}" hint-placeholder-val="{{ false }}">
<svg width="300" height="420" viewBox="0 0 300 420" style="position: absolute; inset: 0" aria-hidden="true">
<g fill="none" stroke="#5E8B5A" stroke-width="1.5" stroke-linecap="round">
<path d="M8 120 C 30 80, 40 50, 70 14"></path>
<path d="M22 92 c -12 -4 -18 -14 -16 -26 c 12 2 18 12 16 26z"></path>
<path d="M36 64 c 4 -12 14 -18 26 -16 c -2 12 -12 18 -26 16z"></path>
<path d="M292 300 C 270 340, 260 370, 230 410"></path>
<path d="M278 330 c 12 2 18 12 16 26 c -12 -2 -18 -12 -16 -26z"></path>
<path d="M262 368 c -4 12 -14 18 -26 16 c 2 -12 12 -18 26 -16z"></path>
</g>
</svg>
</sc-if>
<sc-if value="{{isPines}}" hint-placeholder-val="{{ false }}">
<svg width="300" height="420" viewBox="0 0 300 420" style="position: absolute; inset: 0" aria-hidden="true">
<g fill="#2F5A3F"><polygon points="22,420 40,372 58,420"></polygon><polygon points="26,392 40,352 54,392"></polygon><polygon points="30,366 40,336 50,366"></polygon></g>
<g fill="#3E6E4E"><polygon points="52,420 64,388 76,420"></polygon><polygon points="55,400 64,374 73,400"></polygon></g>
<g fill="#2F5A3F"><polygon points="242,420 260,372 278,420"></polygon><polygon points="246,392 260,352 274,392"></polygon><polygon points="250,366 260,336 270,366"></polygon></g>
<g fill="#3E6E4E"><polygon points="224,420 236,388 248,420"></polygon><polygon points="227,400 236,374 245,400"></polygon></g>
<circle cx="24" cy="24" r="2" fill="#9A3B2E"></circle><circle cx="276" cy="30" r="2" fill="#9A3B2E"></circle><circle cx="40" cy="60" r="1.5" fill="#C9B79C"></circle><circle cx="262" cy="70" r="1.5" fill="#C9B79C"></circle>
</svg>
</sc-if>
<sc-if value="{{isHearts}}" hint-placeholder-val="{{ false }}">
<svg width="300" height="420" viewBox="0 0 300 420" style="position: absolute; inset: 0" aria-hidden="true">
<g fill="#E58AA2"><path transform="translate(14 20) scale(0.9)" d="M12 21s-7-4.5-9.5-9A5 5 0 0 1 12 6a5 5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"></path><path transform="translate(262 40) scale(0.7)" d="M12 21s-7-4.5-9.5-9A5 5 0 0 1 12 6a5 5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"></path><path transform="translate(270 340) scale(1)" d="M12 21s-7-4.5-9.5-9A5 5 0 0 1 12 6a5 5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"></path><path transform="translate(16 372) scale(0.6)" d="M12 21s-7-4.5-9.5-9A5 5 0 0 1 12 6a5 5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"></path></g>
<g fill="none" stroke="#B03A5B" stroke-width="1"><path transform="translate(40 8) scale(0.55)" d="M12 21s-7-4.5-9.5-9A5 5 0 0 1 12 6a5 5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"></path><path transform="translate(244 384) scale(0.6)" d="M12 21s-7-4.5-9.5-9A5 5 0 0 1 12 6a5 5 0 0 1 9.5 6c-2.5 4.5-9.5 9-9.5 9z"></path></g>
</svg>
</sc-if>
<div style="position: relative; height: 100%; box-sizing: border-box; padding: 24px 26px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<p style="margin: 0; font-family: 'DM Serif Display', Georgia, serif; font-size: 32px; line-height: 1.05; color: {{ink}}">{{headline}}</p>
<p style="margin: 0; font-size: 9px; letter-spacing: 0.18em; font-weight: 600; color: {{accent}}">{{sub}}</p>
</div>
<div style="width: 176px; height: 168px; box-sizing: border-box; border: 6px solid {{frame}}; border-radius: 4px; background: {{photoBg}}; box-shadow: 0 6px 16px rgba(0,0,0,0.14); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="{{ink}}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Portrait placeholder"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-5-5L5 21"></path></svg>
<span style="font-size: 9px; font-weight: 500; opacity: 0.8; max-width: 140px">{{photoLabel}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; width: 100%">
<p style="margin: 0; font-size: 12px; font-weight: 600">Dear {{toName}},</p>
<p style="margin: 0; font-size: 11px; line-height: 1.45; white-space: pre-line; max-height: 64px; overflow: hidden">{{message}}</p>
<p style="margin: 0; font-size: 11px; font-weight: 600">With love, {{fromName}}</p>
</div>
<p style="margin: auto 0 0; font-size: 7.5px; letter-spacing: 0.12em; opacity: 0.7">MADE WITH MAGIC PORTRAITS AI</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["birthday-confetti","birthday-balloons","xmas-classic","xmas-snow","newyear-midnight","newyear-champagne","thankyou-botanical","holidays-winter","general-love","general-congrats"],"default":"birthday-confetti"},"toName":{"editor":"text","default":"Grandma Rose"},"fromName":{"editor":"text","default":"Sam"},"message":{"editor":"text","default":"Wishing you the happiest day. Thought you would love seeing Biscuit in his royal robes!"},"photoLabel":{"editor":"text","default":"Your portrait"},"$preview":{"width":300,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      'birthday-confetti': { bg: '#FFF6EC', ink: '#2A1B3D', accent: '#B5401F', photoBg: '#F7D9C4', frame: '#FFFFFF', headline: 'Happy Birthday', sub: 'MAKE A WISH', decor: 'confetti' },
      'birthday-balloons': { bg: '#EAF4FF', ink: '#14304F', accent: '#2457B8', photoBg: '#CFE2F7', frame: '#FFFFFF', headline: 'Happy Birthday', sub: 'ANOTHER YEAR OF YOU', decor: 'balloons' },
      'xmas-classic': { bg: '#1E4D3A', ink: '#FFF8EC', accent: '#E9B949', photoBg: '#2F6A52', frame: '#E9B949', headline: 'Merry Christmas', sub: 'AND A JOYFUL SEASON', decor: 'star' },
      'xmas-snow': { bg: '#F2F6F9', ink: '#7A1F2B', accent: '#A3202F', photoBg: '#DCE6EE', frame: '#FFFFFF', headline: 'Happy Christmas', sub: 'WARMEST WISHES', decor: 'snow' },
      'newyear-midnight': { bg: '#141A33', ink: '#F5F1E6', accent: '#E7C46A', photoBg: '#263056', frame: '#E7C46A', headline: 'Happy New Year', sub: 'HERE’S TO 2027', decor: 'fireworks' },
      'newyear-champagne': { bg: '#F8F1E2', ink: '#3B2F1A', accent: '#8A6516', photoBg: '#EADBB8', frame: '#FFFFFF', headline: 'Cheers to 2027', sub: 'HAPPY NEW YEAR', decor: 'bubbles' },
      'thankyou-botanical': { bg: '#F1F4EC', ink: '#263A2A', accent: '#41693E', photoBg: '#D9E4D1', frame: '#FFFFFF', headline: 'Thank You', sub: 'FROM THE BOTTOM OF MY HEART', decor: 'leaves' },
      'holidays-winter': { bg: '#F3EEE4', ink: '#23422F', accent: '#9A3B2E', photoBg: '#E2DACB', frame: '#FFFFFF', headline: 'Happy Holidays', sub: 'WARM WISHES THIS SEASON', decor: 'pines' },
      'general-love': { bg: '#FBEFF1', ink: '#5A1F33', accent: '#A8304F', photoBg: '#F3D5DC', frame: '#FFFFFF', headline: 'With Love', sub: 'THINKING OF YOU', decor: 'hearts' },
      'general-congrats': { bg: '#EEF3F8', ink: '#1E3550', accent: '#2C5E8F', photoBg: '#D6E2EE', frame: '#FFFFFF', headline: 'Congratulations', sub: 'SO PROUD OF YOU', decor: 'confetti' }
    };
    const t = T[this.props.variant] || T['birthday-confetti'];
    return {
      ...t,
      isConfetti: t.decor === 'confetti',
      isBalloons: t.decor === 'balloons',
      isStar: t.decor === 'star',
      isSnow: t.decor === 'snow',
      isFireworks: t.decor === 'fireworks',
      isBubbles: t.decor === 'bubbles',
      isLeaves: t.decor === 'leaves',
      isPines: t.decor === 'pines',
      isHearts: t.decor === 'hearts',
      toName: this.props.toName || 'Grandma Rose',
      fromName: this.props.fromName || 'Sam',
      message: this.props.message ?? 'Wishing you the happiest day. Thought you would love seeing Biscuit in his royal robes!',
      photoLabel: this.props.photoLabel || 'Your portrait'
    };
  }
}
</script>
</body>
</html>
