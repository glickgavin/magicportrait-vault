class Component extends DCLogic {
  renderVals() {
    const names = ['Pet Portraits', 'Masterpiece', 'Family Portraits', 'Memorial', 'Photo Tiles', 'Photo Books'];
    const tones = ['#EADFCF', '#E2D6EA', '#DCE6EE', '#E6E1D3', '#F0DCDC', '#DDE7DA'];

}
