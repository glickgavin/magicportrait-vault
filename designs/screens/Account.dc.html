<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=DM+Serif+Display&amp;display=swap">
<style>
body{margin:0}
a{color:rgba(0,0,0,0.8)}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F1E7; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: rgba(0,0,0,0.8)">
<div aria-hidden="true" style="position: absolute; inset: 0; overflow: hidden"><dc-import name="VaultHome" initials="{{initials}}" hint-size="390px,1780px"></dc-import></div>
<div style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; background: rgba(0,0,0,0.35)"></div>
<div role="dialog" aria-label="Account" style="position: absolute; top: 60px; right: 10px; width: 300px; background: #FFFFFF; border-radius: 20px; box-shadow: 0 16px 40px rgba(0,0,0,0.22); padding: 16px; display: flex; flex-direction: column; gap: 12px">
<span aria-hidden="true" style="position: absolute; top: -6px; right: 72px; width: 12px; height: 12px; background: #FFFFFF; transform: rotate(45deg)"></span>
<div style="display: flex; align-items: center; gap: 12px">
<span style="flex: none; width: 48px; height: 48px; border-radius: 999px; background: linear-gradient(135deg, #FF8F3F, #F24BDF 55%, #DD07C4); color: #FFFFFF; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{initials}}</span>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 16px; font-weight: 800">{{name}}</span>
<span style="font-size: 13px; color: rgba(0,0,0,0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{email}}</span>
</div>
</div>
<div style="height: 1px; background: rgba(0,0,0,0.08)"></div>
<nav aria-label="Account" style="display: flex; flex-direction: column">
<a href="MyCards.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; text-decoration: none; font-size: 15px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B8059F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="M22 7l-10 6L2 7"></path></svg>My cards</a>
<a href="VaultPortraits.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; text-decoration: none; font-size: 15px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B8059F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="M21 15l-5-5L5 21"></path></svg>My portraits</a>
<a href="Orders.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; text-decoration: none; font-size: 15px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B8059F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg>Orders, downloads &amp; mugs</a>
<sc-if value="{{isSuper}}" hint-placeholder-val="{{ true }}">
<a href="Settings.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 44px; text-decoration: none; font-size: 15px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B8059F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg><span style="flex: 1">Settings</span><span style="padding: 3px 8px; border-radius: 999px; background: #2B2B2B; color: #FFFFFF; font-size: 11px; font-weight: 700">Super user</span></a>
</sc-if>
</nav>
<div style="height: 1px; background: rgba(0,0,0,0.08)"></div>
<a href="SignIn.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 12px; background: rgba(0,0,0,0.05); text-decoration: none; font-size: 15px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,0.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5M21 12H9"></path></svg>Sign out</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"superUser":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sup = this.props.superUser ?? true;
    return sup
      ? { isSuper: true, initials: 'GG', name: 'Gavin Glick', email: 'gavin@storyboards.io' }
      : { isSuper: false, initials: 'SL', name: 'Sam Lee', email: 'sam@example.com' };
  }
}
</script>
</body>
</html>
