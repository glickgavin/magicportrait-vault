<!doctype html>
<html lang="en">
  <body style="margin:0;background:#F3F1E7;font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;color:rgba(0,0,0,0.8)">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F3F1E7;padding:32px 16px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:460px;background:#FFFFFF;border-radius:20px;padding:32px 28px">
          <tr><td style="font-size:14px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#B8059F">My Magic Portraits</td></tr>
          <tr><td style="padding-top:12px;font-size:24px;font-weight:800">Your sign-in code</td></tr>
          <tr><td style="padding-top:8px;font-size:16px;line-height:1.5;color:rgba(0,0,0,0.65)">Enter this code to sign in. It works for 10 minutes.</td></tr>
          <tr><td style="padding:24px 0"><div style="font-size:40px;font-weight:800;letter-spacing:10px;text-align:center;background:#FDE7FA;border-radius:14px;padding:18px 0;color:#2B1B2E">{{ .Token }}</div></td></tr>
          <tr><td style="font-size:13px;line-height:1.5;color:rgba(0,0,0,0.55)">If you didn't ask for this, you can ignore this email. Someone may have typed your email by mistake.</td></tr>
        </table>
        <div style="padding-top:16px;font-size:12px;color:rgba(0,0,0,0.5)">Magic Portraits · magicportraits.ai</div>
      </td></tr>
    </table>
  </body>
</html>
